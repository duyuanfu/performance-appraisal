spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:appraisal_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: 
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
      data-locations: classpath:test-data.sql
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: RawCenterAppraisalSecretKeyForJwtAuthentication20261005Secure!
    expiration-hours: 24
  upload:
    dir: ./data/uploads/projects
  default-metrics:
    monthly:
      - metric-name: 职责履行
        metric-desc: 岗位职责履行与工作要求执行情况
        max-score: 100.0000
        weight: 30.0000
        sort-order: 1
      - metric-name: 主要业绩
        metric-desc: 月度重点业绩产出与实际工作成效
        max-score: 100.0000
        weight: 50.0000
        sort-order: 2
      - metric-name: 团队建设
        metric-desc: 团队协作配合、作风建设与组织执行力
        max-score: 100.0000
        weight: 20.0000
        sort-order: 3
    target-project:
      - metric-name: 完成度
        metric-desc: 项目目标达成与实际任务完成程度
        max-score: 100.0000
        weight: 30.0000
        sort-order: 1
      - metric-name: 完成质量
        metric-desc: 项目产出质量、标准达成及业务赋能实效
        max-score: 100.0000
        weight: 50.0000
        sort-order: 2
      - metric-name: 完成时效性
        metric-desc: 推进节奏、时间节点把控及完成时效
        max-score: 100.0000
        weight: 20.0000
        sort-order: 3
    special-innovation:
      - metric-name: 完成度
        metric-desc: 项目目标达成与实际任务完成程度
        max-score: 100.0000
        weight: 30.0000
        sort-order: 1
      - metric-name: 完成质量
        metric-desc: 项目产出质量、标准达成及业务赋能实效
        max-score: 100.0000
        weight: 50.0000
        sort-order: 2
      - metric-name: 完成时效性
        metric-desc: 推进节奏、时间节点把控及完成时效
        max-score: 100.0000
        weight: 20.0000
        sort-order: 3
