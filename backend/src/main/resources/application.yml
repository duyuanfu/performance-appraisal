server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: performance-appraisal-backend
  profiles:
    active: prod

  datasource:
    # Connect to MySQL Server
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:appraisal_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    encoding: UTF-8
  sql:
    init:
      # Schema and reference data are owned by Flyway migrations.
      mode: never

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: RawCenterAppraisalSecretKeyForJwtAuthentication20261005Secure!
    expiration-hours: 24
  upload:
    dir: ./data/uploads/projects

  # 业务参数配置：V2 默认考核指标库（月度考核、目标绩效任务、专项与创新任务）
  default-metrics:
    monthly:
      - metric-name: 职责履行
        metric-desc: 岗位职责履行与工作要求执行情况
        max-score: 100.0000
        weight: 30.0000
        sort-order: 1
      - metric-name: 主要业绩
        metric-desc: 月度重点业绩产出与实际工作成效
        max-score: 100.0000
        weight: 50.0000
        sort-order: 2
      - metric-name: 团队建设
        metric-desc: 团队协作配合、作风建设与组织执行力
        max-score: 100.0000
        weight: 20.0000
        sort-order: 3

    target-project:
      - metric-name: 完成度
        metric-desc: 项目目标达成与实际任务完成程度
        max-score: 100.0000
        weight: 30.0000
        sort-order: 1
      - metric-name: 完成质量
        metric-desc: 项目产出质量、标准达成及业务赋能实效
        max-score: 100.0000
        weight: 50.0000
        sort-order: 2
      - metric-name: 完成时效性
        metric-desc: 推进节奏、时间节点把控及完成时效
        max-score: 100.0000
        weight: 20.0000
        sort-order: 3

    special-innovation:
